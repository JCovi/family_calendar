<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Family Calendar</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- LOADING SCREEN -->
    <div id="loadingScreen" class="auth-screen">
        <div class="auth-card">
            <h1>Family Calendar</h1>
            <p>Loading...</p>
        </div>
    </div>


    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="auth-screen hidden">

        <div class="auth-card">

            <h1>Family Calendar</h1>

            <p class="auth-subtitle">
                Enter the family password to continue.
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <p
                    id="loginError"
                    class="login-error hidden"
                ></p>

                <button
                    type="submit"
                    id="loginButton"
                    class="primary-button auth-button"
                >
                    Enter
                </button>

            </form>

        </div>

    </div>


    <!-- APPLICATION -->
    <div id="appContainer" class="hidden">

        <header class="site-header">

            <h1>Family Calendar</h1>

            <button
                id="logoutButton"
                class="secondary-button"
            >
                Log Out
            </button>

        </header>

        <main>

            <!-- MONTH VIEW -->
            <section
                id="monthView"
                class="calendar-container"
            >

                <div class="calendar-header">

                    <button
                        id="previousMonth"
                        class="month-button"
                    >
                        &#10094;
                    </button>

                    <div class="date-navigation">

                        <h2 id="monthName"></h2>

                        <select
                            id="yearSelect"
                            aria-label="Select year"
                        ></select>

                    </div>

                    <button
                        id="nextMonth"
                        class="month-button"
                    >
                        &#10095;
                    </button>

                </div>

                <div class="weekdays">
                    <div>Sun</div>
                    <div>Mon</div>
                    <div>Tue</div>
                    <div>Wed</div>
                    <div>Thu</div>
                    <div>Fri</div>
                    <div>Sat</div>
                </div>

                <div
                    id="calendarGrid"
                    class="calendar-grid"
                ></div>

            </section>


            <!-- DAY VIEW -->
            <section
                id="dayView"
                class="day-view hidden"
            >

                <button
                    id="backToCalendar"
                    class="back-button"
                >
                    &#10094; Back to Calendar
                </button>

                <div class="day-header">
                    <h2 id="dayViewDate"></h2>
                </div>

                <div class="day-section">

                    <div class="section-heading">

                        <h3>Events</h3>

                        <button
                            id="addEventButton"
                            class="primary-button"
                        >
                            + Add Event
                        </button>

                    </div>


                    <!-- EVENT FORM -->
                    <form
                        id="eventForm"
                        class="event-form hidden"
                    >

                        <h4 id="eventFormHeading">
                            Add Event
                        </h4>

                        <div class="form-group">

                            <label for="eventTitle">
                                Event Title
                            </label>

                            <input
                                type="text"
                                id="eventTitle"
                                required
                                maxlength="100"
                            >

                        </div>

                        <div class="form-group">

                            <label for="eventTime">
                                Time
                            </label>

                            <input
                                type="time"
                                id="eventTime"
                            >

                        </div>

                        <div class="form-group">

                            <label for="eventLocation">
                                Location
                            </label>

                            <input
                                type="text"
                                id="eventLocation"
                                maxlength="200"
                            >

                        </div>

                        <div class="form-group">

                            <label for="eventNotes">
                                Notes
                            </label>

                            <textarea
                                id="eventNotes"
                                rows="4"
                                maxlength="1000"
                            ></textarea>

                        </div>

                        <div class="form-actions">

                            <button
                                type="button"
                                id="cancelEventButton"
                                class="secondary-button"
                            >
                                Cancel
                            </button>

                            <button
                                type="submit"
                                id="saveEventButton"
                                class="primary-button"
                            >
                                Save Event
                            </button>

                        </div>

                    </form>


                    <div
                        id="eventsList"
                        class="events-list"
                    >

                        <p class="empty-message">
                            No events have been added yet.
                        </p>

                    </div>

                </div>


                <!-- PHOTOS -->
                <div class="day-section">

                    <div class="section-heading">

                        <h3>Photos</h3>

                        <button
                            id="uploadPhotosButton"
                            class="primary-button"
                        >
                            + Add Photos
                        </button>

                    </div>

                    <!-- Hidden native file picker -->
                    <input
                        type="file"
                        id="photoInput"
                        accept="image/jpeg,image/png,image/webp,image/heic,image/heif,.jpg,.jpeg,.png,.webp,.heic,.heif"
                        multiple
                        hidden
                    >

                    <div
                        id="photoUploadStatus"
                        class="photo-upload-status hidden"
                    ></div>

                    <div
                        id="photosContainer"
                        class="photos-placeholder"
                    >
                        <p>
                            No photos have been added yet.
                        </p>
                    </div>

                </div>

            </section>

        </main>

    </div>

    <!-- PHOTO VIEWER -->
<div
    id="photoViewer"
    class="photo-viewer hidden"
    aria-hidden="true"
>
    <button
        id="closePhotoViewer"
        class="photo-viewer-close"
        type="button"
        aria-label="Close photo"
    >
        &times;
    </button>

    <button
        id="previousPhoto"
        class="photo-viewer-arrow photo-viewer-previous"
        type="button"
        aria-label="Previous photo"
    >
        &#10094;
    </button>

    <div class="photo-viewer-content">
        <img
            id="photoViewerImage"
            src=""
            alt=""
        >

        <p
            id="photoViewerCaption"
            class="photo-viewer-caption"
        ></p>

        <p
            id="photoViewerCounter"
            class="photo-viewer-counter"
        ></p>

        <div class="photo-caption-editor">
             <textarea
                 id="photoCaptionInput"
                 class="photo-caption-input"
                 maxlength="500"
                 placeholder="Add a caption..."
                 rows="2"
             ></textarea>

             <button
               id="savePhotoCaptionButton"
                  class="photo-caption-save"
                 type="button"
              >
                 Save Caption
              </button>
        </div>

    <button
        id="deletePhotoButton"
     class="photo-viewer-delete"
     type="button"
    >
        Delete Photo
    </button>

    </div>

    <button
        id="nextPhoto"
        class="photo-viewer-arrow photo-viewer-next"
        type="button"
        aria-label="Next photo"
    >
        &#10095;
    </button>
</div>

    <script src="app.js"></script>

</body>
</html>
